'er_coordinator'], msg('perm.acknowledgeArrival')), sameHospital),\n  requestClarification: deptStaff(['er_coordinator', 'doctor', 'nurse'], () => msg('perm.requestClarification')),\n  recordTriage: deptStaff(['er_coordinator', 'nurse', 'doctor'], () => msg('perm.recordTriage')),\n  assignCoordinator: all(roleIs(['er_coordinator'], msg('perm.assignCoordinator')), sameHospital),\n\n  reserveBed: coordinatorOf(msg('what.reserveBeds')),\n  extendReservation: coordinatorOf(msg('what.extendReservations')),\n  releaseReservation: coordinatorOf(msg('what.releaseReservations')),\n  confirmStaffing: coordinatorOf(msg('what.confirmStaffing')),\n  reportStaffingGap: coordinatorOf(msg('what.reportStaffingGaps')),\n  confirmCapacity: withDept('ICU', coordinatorOf(msg('what.confirmCapacity'))),\n  confirmPlacement: deptStaff(['er_coordinator', 'icu_coordinator', 'nurse'], (r) => msg('perm.confirmPlacement', { dept: deptMsg(r.department) })),\n  confirmDeparture: deptStaff(['er_coordinator', 'icu_coordinator', 'nurse'], (r) => msg('perm.confirmDeparture', { dept: deptMsg(r.department) })),\n  confirmArrival: (u, r) => (r.entity === 'transferRequest'\n    ? withDept('ICU', deptStaff(['icu_coordinator', 'nurse'], () => msg('perm.confirmIcuArrival')))(u, r)\n    : any(msg('perm.confirmErArrival'), deptStaff(['er_coordinator', 'nurse'], () => msg('perm.confirmErArrival')),\n      all(roleIs(['paramedic'], msg('perm.confirmErArrival')), assigned(msg('perm.confirmErArrival'))))(u, r)),\n\n  reportFault: deptStaff(['nurse', 'er_coordinator', 'icu_coordinator'], (r) => msg('perm.reportFault', { dept: deptMsg(r.department) })),\n  updateTicketStatus: techFor(VERB.workOn),\n  resolveFault: techFor(VERB.resolve),\n  reopenTicket: any(msg('perm.reopenTicket'), deptStaff(['nurse', 'er_coordinator', 'icu_coordinator'], () => msg('perm.reopenTicket')), techFor(VERB.reopen)),\n  recordEquipmentCheck: all(roleIs(['biomed_tech'], msg('perm.equipmentCheck')), sameHospital),\n  completeCleaning: all(roleIs(['housekeeping'], msg('perm.housekeepingOnly')), sameHospital),\n  verifyReadiness: all(roleIs(['nurse'], msg('perm.verifyNurseOnly')), sameHospital,\n    sameDepartment((r) => msg('perm.verifyDept', { dept: deptMsg(r.department) }))),\n\n  requestTransfer: withDept('ER', all(roleIs(['doctor'], erDoctor), sameHospital, sameDepartment(erDoctor))),\n  approveTransfer: withDept('ICU', all(roleIs(['doctor'], icuDecision), sameHospital, sameDepartment(icuDecision))),\n  cancelTransferRequest: any(msg('perm.cancelTransfer'),\n    withDept('ER', all(roleIs(['doctor'], erDoctor), sameHospital, sameDepartment(erDoctor))),\n    withDept('ICU', all(roleIs(['icu_coordinator'], erDoctor), sameHospital, sameDepartment(erDoctor)))),\n  flagStepDown: withDept('ICU', all(roleIs(['doctor'], msg('perm.icuDoctorStepDown')), sameHospital, sameDepartment(msg('perm.icuDoctorStepDown')))),\n  recordDisposition: deptStaff(['doctor'], (r) => msg('perm.recordDisposition', { dept: deptMsg(r.department) })),\n  orderDiagnostic: deptStaff(['doctor'], (r) => msg('perm.orderDiagnostic', { dept: deptMsg(r.department) })),\n  acknowledgeReport: deptStaff(['doctor'], (r) => msg('perm.acknowledgeReport', { dept: deptMsg(r.department) })),\n\n  assignPorter: all(roleIs(COORDINATORS, msg('perm.assignPorter')), sameHospital),\n  confirmPickup: all(roleIs(['porter'], msg('perm.porterPickup')), sameHospital,\n    (u, r) => (r.porterUserId === u.id ? null : msg('perm.assignedPorterPickup'))),\n  confirmDropoff: all(roleIs(['porter'], msg('perm.porterDropoff')), sameHospital,\n    (u, r) => (r.porterUserId === u.id ? null : msg('perm.assignedPorterDropoff'))),\n\n  updateTaskStatus: (u, r) => {\n    const reason = msg('perm.taskRole', { role: ROLE_LOWER[r.requiredRole] ?? msg('roleLower.staff'), inDept: r.department ? msg('perm.inDept', { dept: deptMsg(r.department) }) : msg('common.empty') });\n    const scoped = ['nurse', 'doctor'].includes(r.requiredRole);\n    return all(roleIs([r.requiredRole], reason), sameHospital, scoped ? sameDepartment(reason) : () => null)(u, r);\n  },\n  addComment: all(roleIs(STAFF_ROLES, msg('perm.staffComment')), sameHospital),\n  markNotificationRead: (u, r) => {\n    const to = r.recipient ?? {};\n    const mine = to.deviceRef ? to.deviceRef === r.requesterDevice : to.userId ? to.userId === u.id\n      : to.role === u.role && (!to.hospitalId || to.hospitalId === u.hospitalId) && (!to.department || to.department === u.department);\n    return mine ? null : msg('perm.notificationRecipient');\n  },\n\n  // Read capability: a citizen session sees only the notices sent from its own device.\n  viewCitizenCase: all(roleIs(['citizen', 'paramedic'], msg('perm.ownCaseOnly')), (u, r) => (ownsCase(u, r) ? null : msg('perm.ownCaseOnly'))),\n\n  // Read capability (not a dispatch action): who may see patient aliases, reported concerns, transcripts and care tasks.\n  viewPatientDetails: all(roleIs(CLINICAL_VIEWERS, msg('perm.viewPatient')), sameHospital),\n};\n\nexport function can(user, action, record = {}) {\n  if (!user) return { allowed: false, reason: msg('perm.noUser') };\n  if (user.active === false) return { allowed: false, reason: msg('perm.deactivated') };\n  const rule = RULES[action];\n  if (!rule) return { allowed: false, reason: msg('perm.unknownAction', { action }) };\n  const reason = rule(user, record ?? {});\n  return reason ? { allowed: false, reason } : { allowed: true, reason: null };\n}\n","readiness.js":"// SILA — the ONE shared readiness derivation (SPEC §7), ICU bed candidates/suggestions, the ready-time forecast\n// and read-only helpers. Availability is never stored; every screen and every action derives it from here.\n// All user-facing text is returned as message codes ({ code, params }).\n\nimport { values, isOpenTask, isOpenTicket, ACTIVE_TRANSFER_STATUS } from './data.js';\nimport { msg, iso } from './messages.js';\n\nconst nowIso = () => new Date().toISOString();\nconst coordinatorRole = (dept) => (dept === 'ICU' ? 'icu_coordinator' : 'er_coordinator');\nconst later = (a, b) => (Date.parse(a) >= Date.parse(b) ? a : b);\n\nconst DEPT = { ER: msg('dept.ER'), ICU: msg('dept.ICU') };\nconst CLEANING_LOWER = { required: msg('cleaningLower.required'), assigned: msg('cleaningLower.assigned'), in_progress: msg('cleaningLower.in_progress') };\nconst TICKET_LOWER = { open: msg('ticketLower.open'), assigned: msg('ticketLower.assigned'), in_progress: msg('ticketLower.in_progress'), resolved: msg('ticketLower.resolved') };\nconst SEVERITY_LOWER = { low: msg('severityLower.low'), medium: msg('severityLower.medium'), high: msg('severityLower.high'), critical: msg('severityLower.critical') };\nconst EQUIP_LOWER = { monitor: msg('equipLower.monitor'), ventilator: msg('equipLower.ventilator'), infusion_pump: msg('equipLower.infusion_pump'), oxygen: msg('equipLower.oxygen') };\nconst CHECK_STATE = { failed: msg('checkState.failed'), invalid: msg('checkState.invalid'), missing: msg('checkState.missing') };\nconst REQUIREMENT_NEED = { isolation: msg('reqNeed.isolation'), ventilator: msg('reqNeed.ventilator'), monitor: msg('reqNeed.monitor') };\nconst NO_TEXT = msg('common.empty');\n\nexport function reservationState(res, now = nowIso()) {\n  if (!res) return 'unreserved';\n  if (res.status !== 'active') return res.status; // released | fulfilled | expired\n  if (res.expiresAt && Date.parse(res.expiresAt) <= Date.parse(now)) return 'expired';\n  return 'active';\n}\n\nexport function activeReservationForBed(state, bedId, now = nowIso()) {\n  return values(state, 'reservations').find((r) => r.bedId === bedId && reservationState(r, now) === 'active') ?? null;\n}\n\nexport function activeReservationForCase(state, caseId, now = nowIso()) {\n  return values(state, 'reservations').find((r) => r.caseId === caseId && reservationState(r, now) === 'active') ?? null;\n}\n\nexport function openTicketsForBed(state, bedId) {\n  return values(state, 'maintenanceTickets').filter((t) => t.bedId === bedId && isOpenTicket(t));\n}\n\nexport function openTasksFor(state, predicate) {\n  return values(state, 'tasks').filter((t) => isOpenTask(t) && predicate(t));\n}\n\nexport function latestEquipmentCheck(state, bedId, equipment) {\n  return values(state, 'equipmentChecks')\n    .filter((c) => c.bedId === bedId && c.equipment === equipment)\n    .sort((a, b) => Date.parse(b.checkedAt) - Date.parse(a.checkedAt) || b.id.localeCompare(a.id))[0] ?? null;\n}\n\nexport function isCheckValid(check) {\n  return !!check && check.result === 'passed' && !check.invalidatedAt;\n}\n\nexport function confirmedStaffing(state, bedId) {\n  return values(state, 'staffingAssignments').find((a) => a.bedId === bedId && a.status === 'confirmed') ?? null;\n}\n\nconst workItem = (entity, rec) => (rec ? { entity, id: rec.id, dueAt: rec.dueAt ?? null } : null);\n\n/**\n * deriveBedReadiness(bed, state[, now]) → { available, blockers: [{ type, description, ownerRole, ownerUser, since, workItem }] }\n * Available only if: vacant, cleaning complete/not required, no unresolved technical faults, no unresolved\n * equipment tickets, required equipment checks done, staffing confirmed, nursing readiness verified, not reserved.\n */\nexport function deriveBedReadiness(bed, state, now = nowIso()) {\n  const blockers = [];\n  const add = (b) => blockers.push({ ownerUser: null, workItem: null, ...b });\n  const coord = coordinatorRole(bed.department);\n\n  if (bed.occupancy.status === 'occupied') {\n    const p = state.patients[bed.occupancy.patientId];\n    const c = values(state, 'cases').find((x) => x.patientId === p?.id && x.status === 'active');\n    const stepDown = c?.stepDown?.flagged;\n    add({ type: 'occupied', ownerRole: coord, since: bed.occupancy.since,\n      description: stepDown ? msg('blockerDesc.occupiedStepDown', { alias: p?.alias ?? '' }) : msg('blockerDesc.occupied', { alias: p?.alias ?? '' }),\n      workItem: stepDown ? workItem('task', state.tasks[c.stepDown.taskId]) : null });\n  }\n\n  if (['required', 'assigned', 'in_progress'].includes(bed.cleaning.status)) {\n    const t = openTasksFor(state, (x) => x.category === 'cleaning' && x.linked.bedId === bed.id)[0];\n    const status = CLEANING_LOWER[bed.cleaning.status];\n    add({ type: 'cleaning', ownerRole: 'housekeeping', ownerUser: t?.ownerUserId ?? null, since: bed.cleaning.since,\n      description: t?.status === 'blocked'\n        ? msg('blockerDesc.cleaningBlocked', { status, note: t.history.at(-1)?.note ?? '' })\n        : msg('blockerDesc.cleaning', { status }),\n      workItem: workItem('task', t) });\n  }\n\n  const tickets = openTicketsForBed(state, bed.id);\n  for (const t of tickets) {\n    const technical = t.kind === 'technical';\n    add({ type: technical ? 'technical_fault' : 'equipment_ticket', ownerRole: technical ? 'maintenance_tech' : 'biomed_tech',\n      ownerUser: t.assignedTo ?? null, since: t.reportedAt, workItem: workItem('maintenanceTicket', t),\n      description: msg('blockerDesc.ticket', { ref: t.ref, category: t.category, description: t.description, status: TICKET_LOWER[t.status], severity: SEVERITY_LOWER[t.severity] }) });\n  }\n\n  for (const eq of bed.requiredEquipment) {\n    const check = latestEquipmentCheck(state, bed.id, eq);\n    if (isCheckValid(check)) continue;\n    const ticket = tickets.find((t) => t.kind === 'equipment' && t.equipmentType === eq);\n    const task = openTasksFor(state, (x) => x.category === 'equipment_check' && x.linked.bedId === bed.id && x.linked.equipment === eq)[0];\n    const checkState = check ? (check.result === 'failed' ? CHECK_STATE.failed : CHECK_STATE.invalid) : CHECK_STATE.missing;\n    add({ type: 'equipment_check', equipment: eq, ownerRole: 'biomed_tech', ownerUser: (ticket?.assignedTo ?? task?.ownerUserId) ?? null,\n      since: check?.invalidatedAt ?? check?.checkedAt ?? bed.createdAt,\n      description: msg('blockerDesc.check', { equipment: EQUIP_LOWER[eq], state: checkState, pending: ticket ? msg('blockerDesc.pendingTicket', { ref: ticket.ref }) : NO_TEXT }),\n      workItem: ticket ? workItem('maintenanceTicket', ticket) : workItem('task', task) });\n  }\n\n  if (!confirmedStaffing(state, bed.id)) {\n    const a = values(state, 'staffingAssignments').find((x) => x.bedId === bed.id);\n    const t = openTasksFor(state, (x) => x.category === 'staffing' && x.linked.bedId === bed.id)[0];\n    add({ type: 'staffing', ownerRole: coord, ownerUser: t?.ownerUserId ?? null, since: a?.updatedAt ?? bed.createdAt,\n      description: a?.reason ? msg('blockerDesc.staffingReason', { reason: a.reason }) : msg('blockerDesc.staffing'), workItem: workItem('task', t) });\n  }\n\n  if (bed.occupancy.status === 'vacant' && bed.nursingVerification.status !== 'verified') {\n    const t = openTasksFor(state, (x) => x.category === 'nursing_verification' && x.linked.bedId === bed.id)[0];\n    add({ type: 'nursing_verification', ownerRole: 'nurse', ownerUser: t?.ownerUserId ?? confirmedStaffing(state, bed.id)?.nurseUserId ?? null,\n      since: bed.nursingVerification.since, description: msg('blockerDesc.verification', { dept: DEPT[bed.department] }), workItem: workItem('task', t) });\n  }\n\n  const res = activeReservationForBed(state, bed.id, now);\n  if (res) {\n    const ref = state.cases[res.caseId]?.ref ?? res.caseId;\n    add({ type: 'reserved', ownerRole: coord, ownerUser: res.createdBy, since: res.createdAt,\n      description: res.expiresAt ? msg('blockerDesc.reserved', { ref }) : msg('blockerDesc.reservedHeld', { ref }) }); // expiry is shown separately\n  }\n\n  return { available: blockers.length === 0, blockers };\n}\n\n// Physical blockers are the ones nursing verification depends on (staffing and reservation are separate).\nexport const PHYSICAL_BLOCKERS = ['occupied', 'cleaning', 'technical_fault', 'equipment_ticket', 'equipment_check'];\n\n/**\n * forecastReadyTime(bed, state[, now]) → { estimatedReadyAt, blockingStep, owner, isEstimate, summary }\n * Estimate only: the latest due time among open blocker work items. Any blocker without a due time → \"Unknown\".\n * A reservation is not readiness work, so it is reported separately as reservedUntil.\n */\nexport function forecastReadyTime(bed, state, now = nowIso()) {\n  const { blockers } = deriveBedReadiness(bed, state, now);\n  const work = blockers.filter((b) => b.type !== 'reserved');\n  const reserved = blockers.find((b) => b.type === 'reserved');\n  const reservedUntil = reserved ? (activeReservationForBed(state, bed.id, now)?.expiresAt ?? null) : null;\n  const owner = (b) => ({ role: b.ownerRole, userId: b.ownerUser });\n  const step = (b) => ({ type: b.type, description: b.description });\n\n  if (!work.length) {\n    return { estimatedReadyAt: now, blockingStep: null, owner: null, isEstimate: true, reservedUntil,\n      summary: reserved ? msg('forecast.readyNowReserved') : msg('forecast.readyNow') };\n  }\n  const undated = work.find((b) => !b.workItem?.dueAt);\n  if (undated) {\n    return { estimatedReadyAt: null, blockingStep: step(undated), owner: owner(undated), isEstimate: true, reservedUntil,\n      summary: msg('forecast.unknown', { step: undated.description }) };\n  }\n  const last = work.reduce((a, b) => (Date.parse(b.workItem.dueAt) > Date.parse(a.workItem.dueAt) ? b : a));\n  const overdue = Date.parse(last.workItem.dueAt) < Date.parse(now);\n  const estimatedReadyAt = later(last.workItem.dueAt, now);\n  return { estimatedReadyAt, blockingStep: step(last), owner: owner(last), isEstimate: true, overdue, reservedUntil,\n    summary: overdue ? msg('forecast.estimateOverdue', { time: iso(estimatedReadyAt), step: last.description }) : msg('forecast.estimate', { time: iso(estimatedReadyAt), step: last.description }) };\n}\n\n// ---------------------------------------------------------------------------\n// ICU capacity: compatibility, candidate beds and suggestions\n// ---------------------------------------------------------------------------\nexport const REQUIREMENT_KEYS = ['isolation', 'ventilator', 'monitor'];\n\nexport function compatibilityError(bed, requirements = {}) {\n  const missing = REQUIREMENT_KEYS.find((k) => requirements?.[k] && !bed.capabilities[k]);\n  return missing ? msg('err.incompatible', { bed: bed.label, need: REQUIREMENT_NEED[missing] }) : null;\n}\n\n// Why a bed cannot be confirmed as capacity for this transfer (null when it can).\nexport function icuBedProblem(s, tr, bed, now = nowIso()) {\n  if (!bed || bed.department !== 'ICU' || bed.hospitalId !== tr.hospitalId) return msg('err.notIcuBed');\n  if (bed.occupancy.status !== 'vacant') return msg('err.bedOccupied', { bed: bed.label, alias: s.patients[bed.occupancy.patientId]?.alias ?? '' });\n  const res = activeReservationForBed(s, bed.id, now);\n  if (res) return msg('err.bedReservedFor', { bed: bed.label, ref: s.cases[res.caseId]?.ref ?? '' });\n  const other = values(s, 'transferRequests').find((t) => t.id !== tr.id && ACTIVE_TRANSFER_STATUS.includes(t.status) && t.targetBedId === bed.id);\n  if (other) return msg('err.bedTargeted', { bed: bed.label, ref: other.ref });\n  return compatibilityError(bed, tr.requirements);\n}\n\n// Compatible, vacant, unreserved ICU beds not confirmed for another transfer; fewest blockers first.\nexport function icuCandidates(s, tr, now = nowIso()) {\n  return values(s, 'beds')\n    .filter((b) => b.hospitalId === tr.hospitalId && b.department === 'ICU' && !icuBedProblem(s, tr, b, now))\n    .map((b) => ({ b, n: deriveBedReadiness(b, s, now).blockers.length }))\n    .sort((x, y) => x.n - y.n || x.b.label.localeCompare(y.b.label))\n    .map((x) => x.b);\n}\n\n// Suggested bed per accepted transfer still waiting for capacity confirmation. Oldest request first, so a bed\n// freed by a step-down departure goes to the oldest waiting request. Advisory only: the ICU coordinator confirms.\nexport function suggestedBeds(s, hospitalId, now = nowIso()) {\n  const waiting = values(s, 'transferRequests')\n    .filter((t) => t.hospitalId === hospitalId && t.status === 'accepted' && !t.targetBedId)\n    .sort((a, b) => Date.parse(a.requestedAt) - Date.parse(b.requestedAt));\n  const taken = new Set();\n  const out = {};\n  for (const tr of waiting) {\n    const bed = icuCandidates(s, tr, now).find((b) => !taken.has(b.id)) ?? null;\n    out[tr.id] = bed?.id ?? null;\n    if (bed) taken.add(bed.id);\n  }\n  return out;\n}\n\nexport function suggestedBedFor(s, tr, now = nowIso()) {\n  return suggestedBeds(s, tr.hospitalId, now)[tr.id] ?? null;\n}\n\n// ---------------------------------------------------------------------------\n// Read-only helpers\n// ---------------------------------------------------------------------------\nexport function activeCaseForPatient(state, patientId) {\n  return values(state, 'cases').find((c) => c.patientId === patientId && c.status === 'active') ?? null;\n}\n\nexport function activeTransferForCase(state, caseId) {\n  return values(state, 'transferRequests').find((t) => t.caseId === caseId && ACTIVE_TRANSFER_STATUS.includes(t.status)) ?? null;\n}\n\nconst DEPARTED = { discharge: msg('loc.departed.discharge'), admit_ward: msg('loc.departed.admit_ward'), step_down: msg('loc.departed.step_down') };\nexport function describeLocation(state, patient) {\n  const l = patient.location;\n  switch (l.kind) {\n    case 'bed': return msg('loc.bed', { bed: state.beds[l.bedId]?.label ?? '' });\n    case 'in_transit': return msg('loc.inTransit', { to: state.beds[l.toBedId]?.label ?? '' });\n    case 'er_waiting': return msg('loc.erWaiting');\n    case 'unit_arrival': return msg('loc.unitArrival', { dept: DEPT[l.department] ?? NO_TEXT });\n    case 'pre_hospital': return msg('loc.preHospital');\n    case 'departed': return DEPARTED[l.reason] ?? msg('loc.departed.other');\n    default: return msg('loc.offSite');\n  }\n}\n\nexport function deriveTransferStatus(tr, state, now = nowIso()) {\n  const bed = tr.targetBedId ? state.beds[tr.targetBedId] : null;\n  switch (tr.status) {\n    case 'requested': return { key: 'review', label: msg('trStatus.pendingReview'), ownerRole: 'doctor', ownerDepartment: 'ICU', reason: msg('trReason.awaitingIntensivist') };\n    case 'declined': return { key: 'declined', label: msg('trStatus.declined'), ownerRole: 'doctor', ownerDepartment: 'ER', reason: msg('common.text', { text: tr.clinicalDecision?.reason ?? '' }) };\n    case 'canceled': return { key: 'canceled', label: msg('trStatus.canceled'), ownerRole: null, reason: msg('common.text', { text: tr.cancelReason ?? '' }) };\n    case 'accepted': {\n      if (!bed) {\n        const suggested = suggestedBedFor(state, tr, now);\n        return { key: 'capacity', label: msg('trStatus.waitingCapacity'), ownerRole: 'icu_coordinator', suggestedBedId: suggested,\n          reason: suggested ? msg('trReason.suggested', { bed: state.beds[suggested].label }) : msg('trReason.noCompatibleBed') };\n      }\n      const { available, blockers } = deriveBedReadiness(bed, state, now);\n      if (available) return { key: 'reserve', label: msg('trStatus.readyToReserve', { bed: bed.label }), ownerRole: 'icu_coordinator', reason: msg('trReason.reserve') };\n      return { key: 'prep', label: msg('trStatus.preparing', { bed: bed.label }), ownerRole: blockers[0].ownerRole, ownerUser: blockers[0].ownerUser,\n        reason: blockers[0].description, blockerCount: blockers.length };\n    }\n    case 'reserved': return { key: 'handover', label: msg('trStatus.reserved', { bed: bed?.label ?? '' }), ownerRole: 'er_coordinator', reason: msg('trReason.handoverDeparture') };\n    case 'in_transit': return { key: 'transit', label: msg('trStatus.inTransit'), ownerRole: tr.porterUserId ? 'porter' : 'icu_coordinator', ownerUser: tr.porterUserId, reason: msg('trReason.confirmArrival') };\n    case 'arrived': return { key: 'arrived', label: msg('trStatus.arrived'), ownerRole: 'icu_coordinator', reason: msg('trReason.confirmPlacement', { bed: bed?.label ?? '' }) };\n    default: return { key: 'placed', label: msg('trStatus.completed', { bed: bed?.label ?? '' }), ownerRole: null, reason: NO_TEXT };\n  }\n}\n\nexport function incomingCases(state, hospitalId) {\n  return values(state, 'cases').filter((c) => c.status === 'active' && c.destinationHospitalId === hospitalId\n    && state.patients[c.patientId]?.location.kind === 'pre_hospital');\n}\n\nexport function expectedToFreeSoon(state, hospitalId) {\n  return values(state, 'beds').filter((b) => b.hospitalId === hospitalId && b.department === 'ICU' && b.occupancy.status === 'occupied'\n    && activeCaseForPatient(state, b.occupancy.patientId)?.stepDown?.flagged);\n}\n\nexport function notificationsFor(state, user) {\n  return values(state, 'notifications').filter((n) => (n.to.userId ? n.to.userId === user.id\n    : n.to.role === user.role && (!n.to.hospitalId || n.to.hospitalId === user.hospitalId) && (!n.to.department || n.to.department === user.department)))\n    .sort((a, b) => Date.parse(b.createdAt) - Date.parse(a.createdAt));\n}\n\nexport function myTasks(state, user) {\n  return values(state, 'tasks').filter((t) => isOpenTask(t) && t.hospitalId === user.hospitalId && t.requiredRole === user.role\n    && (!t.department || !['nurse', 'doctor'].includes(user.role) || t.department === user.department)\n    && (!t.ownerUserId || t.ownerUserId === user.id));\n}\n","actions.js":"// SILA — the single mutation entry point. dispatch(actionName, payload, user) → { ok, error?, code?, changed: [ids] }\n// Every action runs, in order: (a) permission check, (b) expectedVersion check against the re-read record,\n// (c) state-transition validation, (d) mutation with version bumps, (e) audit event, (f) notifications and\n// follow-up tasks. Work happens on a structured clone; invariants are checked before anything is committed.\n// Every user-facing text (errors, reasons, titles, notifications, audit summaries) is a message { code, params }.\n\nimport {\n  COLLECTION_OF, SLA_MINUTES, RESERVATION_MINUTES, ACTIVE_TRANSFER_STATUS, DIAGNOSTIC_TYPES,\n  addMinutes, nextId, nextRef, values, isOpenTask, isOpenTicket, checkInvariants,\n} from './data.js';\nimport {\n  msg, iso, DEPT_MSG, ROLE_MSG, CASE_STATUS_MSG, TRANSFER_STATUS_MSG, TASK_STATUS_MSG, TICKET_STATUS_MSG, RESERVATION_STATE_MSG,\n  EQUIP_MSG, DIAG_MSG, SEVERITY_MSG, BLOCKER_TYPE_MSG, SOURCE_MSG, WHY_MSG, DECISION_MSG, NO_TEXT,\n} from './messages.js';\nimport { can } from './permissions.js';\nimport {\n  deriveBedReadiness, reservationState, activeReservationForBed, activeReservationForCase, openTasksFor, openTicketsForBed,\n  latestEquipmentCheck, isCheckValid, confirmedStaffing, activeTransferForCase, PHYSICAL_BLOCKERS, compatibilityError,\n  icuBedProblem, suggestedBeds, suggestedBedFor,\n} from './readiness.js';\n\nconst ACTIONS = {};\nconst action = (name, def) => { ACTIONS[name] = def; };\nexport const ACTION_NAMES = () => Object.keys(ACTIONS);\n\n// The record whose version an action checks (null for creates). The UI uses it to fill expectedVersion.\nexport function targetOf(state, actionName, payload = {}) {\n  const def = ACTIONS[actionName];\n  const t = def?.target ? def.target(state, payload) : null;\n  return t?.noVersion ? null : t?.rec ?? null;\n}\n\n// Read-only check of steps (a) permission and (c) transition rules, without the version check or any mutation.\n// The UI uses it to disable buttons and show the engine's own reason. `permissionOnly` skips (c) for actions\n// whose form (e.g. a required reason) has not been filled in yet.\nexport function preflight(state, actionName, payload, user, now = new Date().toISOString(), { permissionOnly = false } = {}) {\n  const def = ACTIONS[actionName];\n  if (!def) return { ok: false, code: 'invalid', reason: msg('err.unknownAction', { action: actionName }) };\n  const actor = state.users[typeof user === 'string' ? user : user?.id];\n  if (!actor) return { ok: false, code: 'forbidden', reason: msg('err.unknownUser') };\n  const p = payload ?? {};\n  const target = def.target ? def.target(state, p, actor) : null;\n  if (target && target.missing) return { ok: false, code: 'not_found', reason: target.missing };\n  const rec = target?.rec ?? null;\n  const perm = can(actor, actionName, def.scope ? def.scope(state, rec, p, actor) : {});\n  if (!perm.allowed) return { ok: false, code: 'forbidden', reason: perm.reason };\n  if (permissionOnly) return { ok: true, code: null, reason: null };\n  const invalid = def.validate ? def.validate(state, rec, p, actor, now) : null;\n  return invalid ? { ok: false, code: 'invalid', reason: invalid } : { ok: true, code: null, reason: null };\n}\n\n// ---------------------------------------------------------------------------\n// Transaction\n// ---------------------------------------------------------------------------\nclass Tx {\n  constructor(state, actor, now) {\n    this.s = structuredClone(state);\n    this.actor = actor;\n    this.now = now;\n    this.bumped = new Set();\n    this.changed = new Set();\n    this.phase = 'mutate';\n    this.queue = [];\n  }\n\n  // Follow-up work requested during the mutation step runs in step (f), after the audit event.\n  later(fn) {\n    if (this.phase === 'mutate') this.queue.push(fn);\n    else fn();\n  }\n\n  runFollowUps() {\n    this.phase = 'effects';\n    for (const fn of this.queue.splice(0)) fn();\n  }\n\n  // Bump a record's version once per action and mark it changed.\n  touch(rec) {\n    if (!this.bumped.has(rec.id)) { rec.version += 1; this.bumped.add(rec.id); }\n    rec.updatedAt = this.now;\n    this.changed.add(rec.id);\n    return rec;\n  }\n\n  update(rec, patch) {\n    this.touch(rec);\n    Object.assign(rec, patch);\n    return rec;\n  }\n\n  create(entity, fields, prefix = entity) {\n    const id = fields.id ?? nextId(this.s, prefix);\n    const rec = { id, entity, version: 1, createdAt: this.now, updatedAt: this.now, ...fields };\n    this.s[COLLECTION_OF[entity]][id] = rec;\n    this.bumped.add(id);\n    this.changed.add(id);\n    return rec;\n  }\n\n  notify(to, type, message, ref, urgent = false) {\n    this.later(() => this.create('notification', { to, type, message, ref, urgent, readBy: [] }, 'n'));\n  }\n\n  task({ dueMinutes, ...fields }) {\n    const status = fields.status ?? 'open';\n    return this.create('task', {\n      linked: {}, ownerUserId: null, ownerTeam: null, priority: 'normal', completionNotes: null, department: null,\n      dueAt: dueMinutes != null ? addMinutes(this.now, dueMinutes) : null, ...fields, status,\n      history: [{ at: this.now, by: this.actor.id, status, note: null }],\n    }, 'task');\n  }\n\n  // `note` is user text (string) or a system message.\n  setTaskStatus(task, status, note = null) {\n    this.update(task, { status });\n    task.history = [...task.history, { at: this.now, by: this.actor.id, status, note }];\n    if (status === 'done' || status === 'canceled') task.completionNotes = note;\n    return task;\n  }\n\n  timeline(notice, event, detail) {\n    this.touch(notice);\n    notice.timeline = [...notice.timeline, { at: this.now, by: this.actor.id, event, detail }];\n  }\n}\n\n// ---------------------------------------------------------------------------\n// Dispatch\n// ---------------------------------------------------------------------------\nconst fail = (code, error) => ({ ok: false, code, error, changed: [] });\n\n// \"bed ER-04\" / \"Bed ER-04\" etc. as messages (the capitalised form starts a sentence).\nfunction recordName(rec, capital = false) {\n  switch (rec.entity) {\n    case 'bed': return capital ? msg('recCap.bed', { label: rec.label }) : msg('rec.bed', { label: rec.label });\n    case 'case': return capital ? msg('recCap.case', { ref: rec.ref }) : msg('rec.case', { ref: rec.ref });\n    case 'maintenanceTicket': return capital ? msg('recCap.ticket', { ref: rec.ref }) : msg('rec.ticket', { ref: rec.ref });\n    case 'transferRequest': return capital ? msg('recCap.transfer', { ref: rec.ref }) : msg('rec.transfer', { ref: rec.ref });\n    case 'task': return capital ? msg('recCap.task', { title: rec.title }) : msg('rec.task', { title: rec.title });\n    default: return capital ? msg('recCap.other', { id: rec.id }) : msg('rec.other', { id: rec.id });\n  }\n}\n\n/** Pure core: returns { ok, error?, code?, changed, state? } without touching the input state. */\nexport function applyAction(state, actionName, payload, user, now = new Date().toISOString()) {\n  const def = ACTIONS[actionName];\n  if (!def) return fail('invalid', msg('err.unknownAction', { action: actionName }));\n  const actor = state.users[typeof user === 'string' ? user : user?.id];\n  if (!actor) return fail('forbidden', msg('err.unknownUser'));\n  const p = payload ?? {};\n\n  const target = def.target ? def.target(state, p, actor) : null;\n  if (target && target.missing) return fail('not_found', target.missing);\n  const rec = target?.rec ?? null;\n  const versioned = rec && !target.noVersion; // context-only targets (e.g. a comment's subject) are not changed\n\n  // (a) permission — evaluated against the live record's scope.\n  const perm = can(actor, actionName, def.scope ? def.scope(state, rec, p, actor) : {});\n  if (!perm.allowed) return fail('forbidden', perm.reason);\n\n  // (b) optimistic concurrency on the re-read record.\n  if (versioned) {\n    if (p.expectedVersion === undefined || p.expectedVersion === null) {\n      return fail('invalid', msg('version.required', { record: recordName(rec), current: rec.version }));\n    }\n    if (p.expectedVersion !== rec.version) {\n      return fail('conflict', msg('version.conflict', { record: recordName(rec, true), seen: p.expectedVersion, current: rec.version }));\n    }\n  }\n\n  // (c) state-transition validation.\n  const invalid = def.validate ? def.validate(state, rec, p, actor, now) : null;\n  if (invalid) return fail('invalid', invalid);\n\n  // (d) mutate on a clone; the primary record always gets a version bump.\n  const tx = new Tx(state, actor, now);\n  const live = rec ? tx.s[COLLECTION_OF[rec.entity]][rec.id] : null;\n  if (live && versioned) tx.touch(live);\n  const ctx = def.apply(tx, live, p, actor) ?? {};\n\n  // (e) audit — who / what / when / reason.\n  const audit = tx.create('auditEvent', {\n    at: now, actorId: actor.id, actorName: actor.name, actorRole: actor.role, action: actionName,\n    summary: ctx.summary ?? msg('audit.generic', { action: actionName }), reason: ctx.reason ?? p.reason ?? null,\n    refs: ctx.refs ?? (live ? [{ entity: live.entity, id: live.id }] : []), changed: [],\n  }, 'audit');\n  delete audit.version; // audit events are immutable and unversioned\n  audit.changed = [...tx.changed].filter((id) => id !== audit.id);\n  const beforeEffects = new Set(tx.changed);\n\n  // (f) notifications and follow-up tasks.\n  tx.runFollowUps();\n  if (def.effects) def.effects(tx, live, p, actor, ctx);\n  audit.followUps = [...tx.changed].filter((id) => !beforeEffects.has(id));\n\n  const problems = checkInvariants(tx.s);\n  if (problems.length) return fail('invalid', msg('err.consistency', { details: problems.join('; ') }));\n  tx.s.meta.rev = (tx.s.meta.rev ?? 0) + 1;\n  return { ok: true, changed: [...tx.changed], result: ctx.result ?? null, state: tx.s };\n}\n\n// The engine binding: the store wires its persisted state in; tests can bind an in-memory holder.\nlet engine = null;\nexport function bindEngine({ getState, commit, now = () => new Date().toISOString() }) {\n  engine = { getState, commit, now };\n}\nexport function memoryEngine(state, now) {\n  let current = state;\n  bindEngine({ getState: () => current, commit: (s) => { current = s; }, now });\n  return { getState: () => current };\n}\n\nexport function dispatch(actionName, payload, user) {\n  if (!engine) return fail('invalid', msg('err.notBound'));\n  const res = applyAction(engine.getState(), actionName, payload, user, engine.now());\n  if (!res.ok) return { ok: false, code: res.code, error: res.error, changed: [] };\n  engine.commit(res.state, { action: actionName, changed: res.changed });\n  return { ok: true, changed: res.changed, result: res.result };\n}\n\n// ---------------------------------------------------------------------------\n// Lookups and scopes\n// ---------------------------------------------------------------------------\nconst NOT_FOUND = {\n  case: msg('notFound.case'), bed: msg('notFound.bed'), transferRequest: msg('notFound.transfer'), maintenanceTicket: msg('notFound.ticket'),\n  task: msg('notFound.task'), reservation: msg('notFound.reservation'), comment: msg('notFound.clarification'),\n  notification: msg('notFound.notification'), patient: msg('notFound.patient'),\n};\nconst find = (state, entity, id) => {\n  const rec = id ? state[COLLECTION_OF[entity]][id] : null;\n  return rec ? { rec } : { missing: NOT_FOUND[entity] };\n};\n\nconst crewOf = (s, c) => (c.ambulanceAssignmentId ? s.ambulanceAssignments[c.ambulanceAssignmentId]?.crewUserIds ?? [] : []);\nconst caseParties = (s, c) => [c.submittedBy, ...crewOf(s, c)].filter(Boolean);\nconst patientOf = (s, c) => s.patients[c.patientId];\nconst currentDept = (s, c) => patientOf(s, c)?.location.department ?? 'ER';\nconst caseOfPatient = (s, pid) => values(s, 'cases').find((c) => c.patientId === pid && c.status === 'active') ?? null;\n\nconst caseScope = (s, c, p = {}) => ({ entity: 'case', hospitalId: c.destinationHospitalId, department: currentDept(s, c), assignedUserIds: caseParties(s, c),\n  ownerDevice: c.deviceRef ?? null, requesterDevice: p?.deviceRef ?? null });\n// Notification targets for a case's submitter and crew; a shared citizen session is addressed by its device.\nconst partyTargets = (s, c) => caseParties(s, c).map((uid) => (s.users[uid]?.shared ? (c.deviceRef ? { deviceRef: c.deviceRef } : null) : { userId: uid })).filter(Boolean);\nconst bedScope = (s, b) => ({ entity: 'bed', hospitalId: b.hospitalId, department: b.department });\nconst ticketScope = (s, t) => ({ entity: 'maintenanceTicket', hospitalId: t.hospitalId, department: t.department, ticketKind: t.kind });\nconst transferScope = (s, t) => ({ entity: 'transferRequest', hospitalId: t.hospitalId, department: 'ICU', porterUserId: t.porterUserId });\n\nconst hospitalName = (s, id) => s.hospitals[id]?.shortName ?? id;\nconst nonEmpty = (v) => typeof v === 'string' && v.trim().length > 0;\nconst validIso = (v) => typeof v === 'string' && !Number.isNaN(Date.parse(v));\n// A list of blockers for an error message: \"description (owner: Role)\" items.\nconst blockerItems = (blockers) => blockers.map((b) => msg('blockerItem', { description: b.description, owner: ROLE_MSG[b.ownerRole] }));\nconst blockerTypes = (blockers) => blockers.map((b) => BLOCKER_TYPE_MSG[b.type]);\n\nconst toCoordinators = (hospitalId, dept) => ({ role: dept === 'ICU' ? 'icu_coordinator' : 'er_coordinator', hospitalId });\nconst toRole = (role, hospitalId, department) => (department ? { role, hospitalId, department } : { role, hospitalId });\n\n// ---------------------------------------------------------------------------\n// Shared state transitions (only ever called from inside an action's apply/effects)\n// ---------------------------------------------------------------------------\n\n// Nursing verification is a sign-off on the current physical state; any new blocker on a vacant bed resets it.\n// ER beds get an eager verification task; ICU prep tasks are only created after capacity is confirmed for a transfer.\nfunction resetVerification(tx, bed, why) {\n  if (bed.occupancy.status !== 'vacant') return;\n  if (bed.nursingVerification.status === 'verified') {\n    tx.update(bed, { nursingVerification: { status: 'pending', by: null, at: null, since: tx.now, reason: why } });\n  }\n  if (bed.department !== 'ER') return;\n  tx.later(() => {\n    if (openTasksFor(tx.s, (t) => t.category === 'nursing_verification' && t.linked.bedId === bed.id).length) return;\n    tx.task({ category: 'nursing_verification', title: msg('taskTitle.verify', { bed: bed.label }), linked: { bedId: bed.id },\n      requiredRole: 'nurse', department: bed.department, hospitalId: bed.hospitalId,\n      ownerUserId: confirmedStaffing(tx.s, bed.id)?.nurseUserId ?? null, dueMinutes: SLA_MINUTES.nursing_verification });\n  });\n}\n\nfunction placeInBed(tx, patient, bed, caseRec) {\n  tx.update(bed, { occupancy: { status: 'occupied', patientId: patient.id, since: tx.now } });\n  tx.update(patient, { location: { kind: 'bed', hospitalId: bed.hospitalId, department: bed.department, bedId: bed.id, since: tx.now } });\n  return tx.create('placement', { patientId: patient.id, caseId: caseRec.id, bedId: bed.id, hospitalId: bed.hospitalId,\n    status: 'active', startedAt: tx.now, endedAt: null, placedBy: tx.actor.id }, 'pl');\n}\n\n// Physical departure from a bed: vacant, placement ended, cleaning required (with a task), verification reset.\n// ICU turnover also needs the ventilator re-checked (circuit change between patients).\nfunction vacateBed(tx, bed, why) {\n  const placement = values(tx.s, 'placements').find((pl) => pl.bedId === bed.id && pl.status === 'active');\n  if (placement) tx.update(placement, { status: 'ended', endedAt: tx.now, endedBy: tx.actor.id });\n  tx.update(bed, { occupancy: { status: 'vacant', patientId: null, since: tx.now }, cleaning: { status: 'required', since: tx.now, taskId: null } });\n  if (bed.department === 'ICU') {\n    const vent = latestEquipmentCheck(tx.s, bed.id, 'ventilator');\n    if (isCheckValid(vent)) tx.update(vent, { invalidatedAt: tx.now, invalidatedReason: msg('check.invalidatedTurnover') });\n  }\n  tx.later(() => {\n    const clean = tx.task({ category: 'cleaning', title: msg('taskTitle.clean', { bed: bed.label, why }), linked: { bedId: bed.id },\n      requiredRole: 'housekeeping', ownerTeam: 'housekeeping', priority: 'high', department: bed.department,\n      hospitalId: bed.hospitalId, dueMinutes: SLA_MINUTES.cleaning });\n    bed.cleaning = { ...bed.cleaning, taskId: clean.id };\n  });\n  resetVerification(tx, bed, msg('why.vacated', { why }));\n  tx.notify(toRole('housekeeping', bed.hospitalId), 'cleaning_required', msg('notifMsg.cleaningRequired', { bed: bed.label }), { entity: 'bed', id: bed.id });\n}\n\n// A reservation past its expiry keeps status \"active\" until something needs the slot; then it is closed as expired.\nfunction expireStale(tx, predicate) {\n  for (const r of values(tx.s, 'reservations')) {\n    if (r.status === 'active' && reservationState(r, tx.now) === 'expired' && predicate(r)) tx.update(r, { status: 'expired', expiredAt: r.expiresAt });\n  }\n}\n\n// Releases a reservation (including one past its expiry) through the normal workflow. `reason`: user text or message.\nfunction releaseReservationFor(tx, res, reason) {\n  tx.update(res, { status: 'released', releasedAt: tx.now, releasedBy: tx.actor.id, releaseReason: reason });\n  if (res.transferId) {\n    const tr = tx.s.transferRequests[res.transferId];\n    if (tr && tr.status === 'reserved') {\n      tx.update(tr, { status: 'accepted', reservationId: null });\n      for (const id of tr.handoverTaskIds) {\n        const t = tx.s.tasks[id];\n        if (t && isOpenTask(t)) tx.setTaskStatus(t, 'canceled', msg('note.reservationReleased', { reason }));\n      }\n    }\n  }\n  const bed = tx.s.beds[res.bedId];\n  tx.notify(toCoordinators(res.hospitalId, res.department), 'reservation_released', msg('notifMsg.reservationReleased', { bed: bed.label, reason }), { entity: 'bed', id: bed.id });\n  return res;\n}\n\nfunction anyActiveReservationRecord(s, caseId) {\n  return values(s, 'reservations').find((r) => r.caseId === caseId && r.status === 'active') ?? null;\n}\n\nfunction cancelCaseTasks(tx, caseId, note) {\n  for (const t of openTasksFor(tx.s, (x) => x.linked.caseId === caseId)) tx.setTaskStatus(t, 'canceled', note);\n}\n\n// Bed-prep work once capacity is confirmed: link existing work items, create the missing ones (marked prepFor so a\n// canceled request can withdraw them). Never runs before clinical acceptance and capacity confirmation.\nfunction createPrepItems(tx, tr, bed) {\n  const items = [];\n  const link = (task) => {\n    tx.update(task, { linked: { ...task.linked, transferId: tr.id } });\n    items.push({ entity: 'task', id: task.id });\n  };\n  const ensureTask = (category, predicate, fields) => {\n    const existing = openTasksFor(tx.s, (t) => t.category === category && t.linked.bedId === bed.id && predicate(t))[0];\n    if (existing) return link(existing);\n    const t = tx.task({ category, linked: { bedId: bed.id, transferId: tr.id }, hospitalId: bed.hospitalId, department: bed.department,\n      priority: 'high', prepFor: tr.id, ...fields });\n    items.push({ entity: 'task', id: t.id });\n    tx.notify(fields.requiredRole === 'nurse' ? toRole('nurse', bed.hospitalId, 'ICU') : toRole(fields.requiredRole, bed.hospitalId),\n      'prep_task', t.title, { entity: 'task', id: t.id });\n  };\n  for (const b of deriveBedReadiness(bed, tx.s, tx.now).blockers) {\n    if (b.type === 'cleaning') ensureTask('cleaning', () => true, { title: msg('taskTitle.cleanFor', { bed: bed.label, ref: tr.ref }), requiredRole: 'housekeeping', ownerTeam: 'housekeeping', dueMinutes: SLA_MINUTES.cleaning });\n    if (b.type === 'technical_fault' || b.type === 'equipment_ticket') {\n      const ticket = tx.s.maintenanceTickets[b.workItem.id];\n      tx.update(ticket, { linkedTransferId: tr.id });\n      items.push({ entity: 'maintenanceTicket', id: ticket.id });\n    }\n    if (b.type === 'equipment_check' && b.workItem?.entity !== 'maintenanceTicket') {\n      const eq = b.equipment;\n      ensureTask('equipment_check', (t) => t.linked.equipment === eq, { title: msg('taskTitle.checkFor', { equipment: EQUIP_MSG[eq], bed: bed.label, ref: tr.ref }),\n        requiredRole: 'biomed_tech', linked: { bedId: bed.id, transferId: tr.id, equipment: eq }, dueMinutes: SLA_MINUTES.equipment_check });\n    }\n    if (b.type === 'staffing') ensureTask('staffing', () => true, { title: msg('taskTitle. ,\n  nursing_verification: { open: ['accepted'] },\n  staffing: { open: ['accepted'] },\n  equipment_check: { open: ['accepted'] },\n  report_review: { open: ['accepted'] },\n  default: { open: ['accepted', 'in_progress', 'done'], accepted: ['in_progress', 'done'], in_progress: ['done', 'blocked'], blocked: ['in_progress'] },\n};\nconst COMPLETED_BY = { cleaning: 'completeCleaning', nursing_verification: 'verifyReadiness', staffing: 'confirmStaffing',\n  equipment_check: 'recordEquipmentCheck', ward_transfer: 'confirmDeparture', report_review: 'acknowledgeReport' };\nconst ACTION_MSG = { completeCleaning: msg('actionName.completeCleaning'), verifyReadiness: msg('actionName.verifyReadiness'), confirmStaffing: msg('actionName.confirmStaffing'),\n  recordEquipmentCheck: msg('actionName.recordEquipmentCheck'), confirmDeparture: msg('actionName.confirmDeparture'), acknowledgeReport: msg('actionName.acknowledgeReport') };\n\n// The next statuses a task may take, and the dedicated action that completes it (if any). The UI offers\n// exactly these, so it never re-implements the task workflow.\nexport function nextTaskStatuses(task) {\n  return [...((TASK_FLOWS[task.category] ?? TASK_FLOWS.default)[task.status] ?? [])];\n}\nexport function completionActionFor(task) {\n  if (task.category === 'diagnostic') return task.status === 'report_available' && !task.reportAcknowledged ? 'acknowledgeReport' : null;\n  return COMPLETED_BY[task.category] ?? null;\n}\n\nconst taskScope = (s, t) => ({ entity: 'task', hospitalId: t.hospitalId, department: t.department, requiredRole: t.requiredRole });\n\naction('updateTaskStatus', {\n  target: (s, p) => find(s, 'task', p.taskId),\n  scope: (s, t) => taskScope(s, t),\n  validate: (s, t, p) => {\n    if (!isOpenTask(t)) return msg('err.taskAlready', { status: TASK_STATUS_MSG[t.status] });\n    const flow = TASK_FLOWS[t.category] ?? TASK_FLOWS.default;\n    if (!(flow[t.status] ?? []).includes(p.status)) {\n      if (p.status === 'done' && COMPLETED_BY[t.category]) return msg('err.taskCompletesVia', { action: ACTION_MSG[COMPLETED_BY[t.category]] });\n      return msg('err.taskTransition', { from: TASK_STATUS_MSG[t.status], to: TASK_STATUS_MSG[p.status] ?? String(p.status) });\n    }\n    if (p.status === 'blocked' && !nonEmpty(p.note)) return msg('err.describeBlocker');\n    if (p.status === 'canceled' && !nonEmpty(p.note)) return msg('err.reasonRequiredCancelTask');\n    return null;\n  },\n  apply: (tx, t, p, actor) => {\n    tx.setTaskStatus(t, p.status, p.note ?? null);\n    if (['accepted', 'in_progress', 'scheduled', 'done'].includes(p.status) && !t.ownerUserId) t.ownerUserId = actor.id;\n    if (t.category === 'cleaning' && t.linked.bedId && p.status !== 'blocked') {\n      const bed = tx.s.beds[t.linked.bedId];\n      tx.update(bed, { cleaning: { ...bed.cleaning, status: p.status === 'accepted' ? 'assigned' : 'in_progress', since: tx.now } });\n    }\n    if (t.category === 'ambulance_handover' && p.status === 'done') {\n      const c = tx.s.cases[t.linked.caseId];\n      const n = tx.s.arrivalNotices[c.noticeId];\n      if (n) { tx.update(n, { status: 'handover_complete' }); tx.timeline(n, 'handover_complete', msg('tl.handoverComplete')); }\n      if (c.ambulanceAssignmentId) tx.update(tx.s.ambulanceAssignments[c.ambulanceAssignmentId], { status: 'handover_complete' });\n    }\n    return { summary: msg('audit.taskStatus', { title: t.title, status: TASK_STATUS_MSG[p.status] }), reason: p.note ?? null };\n  },\n  effects: (tx, t, p) => {\n    if (t.category === 'diagnostic' && p.status === 'report_available') {\n      const type = DIAG_MSG[t.diagnosticType] ?? msg('diag.other');\n      const alias = tx.s.patients[t.linked.patientId]?.alias ?? '';\n      const orderer = tx.s.users[t.orderedBy];\n      const review = tx.task({ category: 'report_review', title: msg('taskTitle.reportReview', { type }), linked: { ...t.linked, taskId: t.id },\n        requiredRole: 'doctor', department: t.department, hospitalId: t.hospitalId, priority: 'high', dueMinutes: 60,\n        ownerUserId: orderer?.role === 'doctor' && orderer.department === t.department ? orderer.id : null });\n      const message = msg('notifMsg.reportAvailable', { type, alias });\n      if (orderer) tx.notify({ userId: orderer.id }, 'report_available', message, { entity: 'task', id: review.id });\n      if (!orderer || orderer.department !== t.department) tx.notify(toRole('doctor', t.hospitalId, t.department), 'report_available', message, { entity: 'task', id: review.id });\n    }\n    if (p.status === 'blocked') {\n      tx.notify(toCoordinators(t.hospitalId, t.department ?? 'ER'), 'task_blocked', msg('notifMsg.taskBlocked', { title: t.title, note: p.note }), { entity: 'task', id: t.id });\n    }\n    if (t.category === 'ambulance_handover' && p.status === 'done') {\n      const c = tx.s.cases[t.linked.caseId];\n      for (const uid of crewOf(tx.s, c)) tx.notify({ userId: uid }, 'handover_complete', msg('notifMsg.handoverComplete', { ref: c.ref }), { entity: 'case', id: c.id });\n    }\n    if (['handover_send', 'handover_receive'].includes(t.category) && p.status === 'done') {\n      const tr = tx.s.transferRequests[t.linked.transferId];\n      if (tr && tr.handoverTaskIds.every((id) => !isOpenTask(tx.s.tasks[id]))) {\n        tx.notify(toCoordinators(tr.hospitalId, 'ER'), 'handover_complete', msg('notifMsg.handoverDone', { tr: tr.ref }), { entity: 'transferRequest', id: tr.id });\n      }\n    }\n  },\n});\n\n// A doctor orders an investigation; diagnostics staff then move it requested → scheduled → in progress → report available.\naction('orderDiagnostic', {\n  target: (s, p) => {\n    const t = find(s, 'patient', p.patientId);\n    return t.missing ? t : { rec: t.rec, noVersion: true }; // ordering never conflicts with patient movement\n  },\n  scope: (s, patient) => ({ entity: 'patient', hospitalId: patient.location.hospitalId ?? '__offsite__', department: patient.location.department }),\n  validate: (s, patient, p) => {\n    if (!['bed', 'er_waiting', 'unit_arrival'].includes(patient.location.kind) || !caseOfPatient(s, patient.id)) return msg('err.diagnosticOnSite');\n    if (!DIAGNOSTIC_TYPES.includes(p.type)) return msg('err.diagnosticType');\n    if (!nonEmpty(p.reason)) return msg('err.reasonRequiredDiagnostic');\n    return null;\n  },\n  apply: (tx, patient, p, actor) => {\n    const c = caseOfPatient(tx.s, patient.id);\n    const t = tx.task({ category: 'diagnostic', status: 'requested', title: msg('taskTitle.diagnostic', { type: DIAG_MSG[p.type] }), diagnosticType: p.type,\n      orderedBy: actor.id, orderReason: p.reason.trim(), reportAcknowledged: null,\n      linked: { patientId: patient.id, caseId: c.id, bedId: patient.location.bedId ?? null }, requiredRole: 'diagnostics',\n      department: patient.location.department, hospitalId: patient.location.hospitalId, priority: p.priority === 'high' ? 'high' : 'normal' });\n    return { summary: msg('audit.diagnosticOrdered', { type: DIAG_MSG[p.type], ref: c.ref }), reason: p.reason, result: { taskId: t.id },\n      refs: [{ entity: 'task', id: t.id }, { entity: 'case', id: c.id }], task: t };\n  },\n  effects: (tx, patient, p, actor, { task }) => {\n    tx.notify(toRole('diagnostics', task.hospitalId), 'diagnostic_ordered', msg('notifMsg.diagnosticOrdered', { type: DIAG_MSG[p.type], alias: patient.alias }), { entity: 'task', id: task.id });\n  },\n});\n\n// The responsible clinician acknowledges the report; this is separate from diagnostics marking it available.\naction('acknowledgeReport', {\n  target: (s, p) => find(s, 'task', p.taskId),\n  scope: (s, t) => ({ entity: 'task', hospitalId: t.hospitalId, department: t.department }),\n  validate: (s, t) => {\n    if (t.category !== 'diagnostic') return msg('err.notDiagnostic');\n    if (t.status !== 'report_available') return msg('err.reportNotAvailable', { status: TASK_STATUS_MSG[t.status] });\n    if (t.reportAcknowledged) return msg('err.reportAlreadyAcknowledged');\n    return null;\n  },\n  apply: (tx, t, p, actor) => {\n    t.reportAcknowledged = { by: actor.id, at: tx.now, note: p.note ?? null };\n    t.history = [...t.history, { at: tx.now, by: actor.id, status: t.status, note: msg('note.reportAcknowledged') }];\n    for (const r of openTasksFor(tx.s, (x) => x.category === 'report_review' && x.linked.taskId === t.id)) tx.setTaskStatus(r, 'done', p.note ?? msg('note.reportAcknowledged'));\n    const c = tx.s.cases[t.linked.caseId];\n    return { summary: msg('audit.reportAcknowledged', { type: DIAG_MSG[t.diagnosticType] ?? msg('diag.other'), ref: c?.ref ?? '' }), reason: p.note ?? null };\n  },\n});\n\naction('markNotificationRead', {\n  target: (s, p) => find(s, 'notification', p.notificationId),\n  scope: (s, n, p) => ({ entity: 'notification', recipient: n.to, requesterDevice: p?.deviceRef ?? null }),\n  validate: (s, n, p, actor) => (n.readBy.includes(actor.id) ? msg('err.alreadyRead') : null),\n  apply: (tx, n, p, actor) => {\n    n.readBy = [...n.readBy, actor.id];\n    return { summary: msg('audit.notificationRead') };\n  },\n});\n\n// ===========================================================================\n// Comments, staffing gaps, coordinator assignment\n// ===========================================================================\nconst COMMENT_TARGETS = ['case', 'bed', 'task', 'maintenanceTicket', 'transferRequest'];\nconst MAX_COMMENT = 500;\n\n// Who owns the commented record: specific people first; the owning role group only when nobody is assigned.\nfunction commentRecipients(s, rec, author) {\n  const users = new Set();\n  let group = null;\n  if (rec.entity === 'case') {\n    const loc = patientOf(s, rec)?.location;\n    if (rec.assignedCoordinatorId) users.add(rec.assignedCoordinatorId);\n    if (loc?.kind === 'bed') { const n = confirmedStaffing(s, loc.bedId)?.nurseUserId; if (n) users.add(n); }\n    group = toCoordinators(rec.destinationHospitalId, loc?.department ?? 'ER');\n  } else if (rec.entity === 'bed') {\n    const n = confirmedStaffing(s, rec.id)?.nurseUserId;\n    if (n) users.add(n);\n    group = toCoordinators(rec.hospitalId, rec.department);\n  } else if (rec.entity === 'task') {\n    if (rec.ownerUserId) users.add(rec.ownerUserId);\n    group = ['nurse', 'doctor'].includes(rec.requiredRole) ? toRole(rec.requiredRole, rec.hospitalId, rec.department) : toRole(rec.requiredRole, rec.hospitalId);\n  } else if (rec.entity === 'maintenanceTicket') {\n    if (rec.assignedTo) users.add(rec.assignedTo);\n    group = toRole(rec.kind === 'equipment' ? 'biomed_tech' : 'maintenance_tech', rec.hospitalId);\n  } else if (rec.entity === 'transferRequest') {\n    users.add(rec.requestedBy);\n    if (rec.porterUserId) users.add(rec.porterUserId);\n    group = toCoordinators(rec.hospitalId, 'ICU');\n  }\n  users.delete(author.id);\n  if (users.size) return [...users].map((userId) => ({ userId }));\n  const authorInGroup = group && group.role === author.role && group.hospitalId === author.hospitalId;\n  return group && !authorInGroup ? [group] : [];\n}\n\naction('addComment', {\n  // The subject is context only: commenting never bumps its version or conflicts with other edits.\n  target: (s, p) => {\n    if (!COMMENT_TARGETS.includes(p.targetType)) return { missing: msg('err.commentTargets') };\n    const t = find(s, p.targetType, p.targetId);\n    return t.missing ? t : { rec: t.rec, noVersion: true };\n  },\n  scope: (s, rec) => ({ entity: 'comment', hospitalId: rec.entity === 'case' ? rec.destinationHospitalId : rec.hospitalId }),\n  validate: (s, rec, p) => {\n    if (!nonEmpty(p.text)) return msg('err.writeComment');\n    if (p.text.trim().length > MAX_COMMENT) return msg('err.commentTooLong', { max: MAX_COMMENT });\n    return null;\n  },\n  apply: (tx, rec, p, actor) => {\n    const cm = tx.create('comment', { kind: 'note', targetType: rec.entity, targetId: rec.id, caseId: rec.entity === 'case' ? rec.id : null,\n      body: p.text.trim(), authorId: actor.id, status: null }, 'cm');\n    return { summary: msg('audit.comment', { record: recordName(rec) }), result: { commentId: cm.id },\n      refs: [{ entity: rec.entity, id: rec.id }, { entity: 'comment', id: cm.id }], comment: cm };\n  },\n  effects: (tx, rec, p, actor, { comment }) => {\n    const message = msg('notifMsg.comment', { name: actor.name, record: recordName(rec), text: comment.body });\n    for (const to of commentRecipients(tx.s, rec, actor)) tx.notify(to, 'comment', message, { entity: rec.entity, id: rec.id });\n  },\n});\n\naction('reportStaffingGap', {\n  target: (s, p) => find(s, 'bed', p.bedId),\n  scope: (s, b) => bedScope(s, b),\n  validate: (s, bed, p) => {\n    if (!confirmedStaffing(s, bed.id)) return msg('err.staffingAlreadyUnavailable', { bed: bed.label });\n    if (!nonEmpty(p.reason)) return msg('err.reasonRequiredStaffingGap');\n    return null;\n  },\n  apply: (tx, bed, p, actor) => {\n    const a = values(tx.s, 'staffingAssignments').find((x) => x.bedId === bed.id);\n    tx.update(a, { status: 'unavailable', previousNurseUserId: a.nurseUserId, nurseUserId: null, reason: p.reason.trim(),\n      reportedBy: actor.id, reportedAt: tx.now, confirmedBy: null, confirmedAt: null });\n    return { summary: msg('audit.staffingGap', { bed: bed.label }), reason: p.reason, previousNurse: a.previousNurseUserId };\n  },\n  effects: (tx, bed, p, actor, ctx) => {\n    const occupied = bed.occupancy.status === 'occupied';\n    tx.notify(toCoordinators(bed.hospitalId, bed.department), 'staffing_gap',\n      (occupied ? msg('notifMsg.staffingGapUrgent', { bed: bed.label, reason: p.reason.trim() }) : msg('notifMsg.staffingGap', { bed: bed.label, reason: p.reason.trim() })), { entity: 'bed', id: bed.id }, occupied);\n    if (ctx.previousNurse) tx.notify({ userId: ctx.previousNurse }, 'staffing_gap', msg('notifMsg.unassignedFromBed', { bed: bed.label }), { entity: 'bed', id: bed.id });\n    // ER gaps get a coordinator task; ICU prep tasks only come from capacity confirmation for a transfer.\n    if (bed.department === 'ER' && !openTasksFor(tx.s, (t) => t.category === 'staffing' && t.linked.bedId === bed.id).length) {\n      tx.task({ category: 'staffing', title: msg('taskTitle.findCover', { bed: bed.label }), linked: { bedId: bed.id }, requiredRole: 'er_coordinator',\n        department: 'ER', hospitalId: bed.hospitalId, priority: occupied ? 'high' : 'normal', dueMinutes: SLA_MINUTES.staffing });\n    }\n  },\n});\n\naction('assignCoordinator', {\n  target: (s, p) => find(s, 'case', p.caseId),\n  scope: (s, c, p) => caseScope(s, c, p),\n  validate: (s, c, p) => {\n    if (c.status !== 'active') return caseStatusError(c);\n    const u = s.users[p.coordinatorId];\n    if (!u || u.role !== 'er_coordinator' || !u.active || u.hospitalId !== c.destinationHospitalId) return msg('err.coordinatorChoose');\n    if (c.assignedCoordinatorId === u.id) return msg('err.coordinatorAlready', { name: u.name, ref: c.ref });\n    return null;\n  },\n  apply: (tx, c, p) => {\n    const previous = c.assignedCoordinatorId;\n    c.assignedCoordinatorId = p.coordinatorId;\n    return { summary: msg('audit.coordinator', { ref: c.ref, name: tx.s.users[p.coordinatorId].name }), previous };\n  },\n  effects: (tx, c, p, actor) => {\n    if (p.coordinatorId !== actor.id) tx.notify({ userId: p.coordinatorId }, 'assigned', msg('notifMsg.coordinatorAssigned', { ref: c.ref }), { entity: 'case', id: c.id });\n  },\n});\n","selectors.js":"// SILA — pure read-only selectors for dashboards and lists (SPEC §8). Every count is derived from state;\n// readiness itself always comes from deriveBedReadiness().\n\nimport { values, isOpenTask, isOpenTicket, ACTIVE_TRANSFER_STATUS } from './data.js';\nimport { msg } from './messages.js';\nimport { simulatedTrip } from './geo.js';\nimport {\n  deriveBedReadiness, forecastReadyTime, incomingCases, activeReservationForBed, myTasks, expectedToFreeSoon, suggestedBedFor,\n} from './readiness.js';\n\nconst byLabel = (a, b) => a.label.localeCompare(b.label);\nconst ms = (iso) => Date.parse(iso);\n\nexport const BLOCKED_KINDS = {\n  maintenance: ['technical_fault'],\n  equipment: ['equipment_ticket', 'equipment_check'],\n  staffing: ['staffing'],\n};\n// Blockers that are not routine turnover (cleaning / verification / reservation).\nconst HARD_BLOCKERS = Object.values(BLOCKED_KINDS).flat();\n\nexport function erBeds(state, hospitalId) {\n  return values(state, 'beds').filter((b) => b.hospitalId === hospitalId && b.department === 'ER').sort(byLabel);\n}\n\nfunction erWaitingCases(state, hospitalId) {\n  return values(state, 'cases').filter((c) => {\n    const loc = state.patients[c.patientId]?.location;\n    return c.status === 'active' && c.destinationHospitalId === hospitalId && loc?.kind === 'er_waiting' && loc.department === 'ER';\n  }).sort((a, b) => ms(a.arrivedAt ?? a.createdAt) - ms(b.arrivedAt ?? b.createdAt));\n}\n\nconst withReadiness = (state, hospitalId, now) => erBeds(state, hospitalId).map((b) => ({ b, r: deriveBedReadiness(b, state, now) }));\nconst hasBlocker = (r, types) => r.blockers.some((x) => types.includes(x.type));\n\nexport function selectIncoming(state, hospitalId) {\n  const eta = (c) => ms(state.arrivalNotices[c.noticeId]?.etaAt ?? '9999-12-31T00:00:00Z');\n  return incomingCases(state, hospitalId).sort((a, b) => eta(a) - eta(b));\n}\nexport const selectAwaitingTriage = (state, hospitalId) => erWaitingCases(state, hospitalId).filter((c) => c.journey === 'triage_pending');\nexport const selectWaiting = (state, hospitalId) => erWaitingCases(state, hospitalId).filter((c) => c.journey !== 'triage_pending');\nexport const selectInCare = (state, hospitalId) => erBeds(state, hospitalId).filter((b) => b.occupancy.status === 'occupied');\nexport const selectAvailableBeds = (state, hospitalId, now) => withReadiness(state, hospitalId, now).filter(({ r }) => r.available).map(({ b }) => b);\nexport const selectReservedBeds = (state, hospitalId, now) => withReadiness(state, hospitalId, now).filter(({ r }) => hasBlocker(r, ['reserved'])).map(({ b }) => b);\nexport const selectBeingCleaned = (state, hospitalId, now) => withReadiness(state, hospitalId, now).filter(({ r }) => hasBlocker(r, ['cleaning'])).map(({ b }) => b);\n// Includes occupied beds: a fault or staffing gap on an occupied bed is an urgent operational blocker.\nexport const selectBlockedBeds = (state, hospitalId, now, kind) =>\n  withReadiness(state, hospitalId, now).filter(({ r }) => hasBlocker(r, BLOCKED_KINDS[kind] ?? HARD_BLOCKERS)).map(({ b }) => b);\n\nexport function selectIcuRequests(state, hospitalId) {\n  return values(state, 'transferRequests')\n    .filter((t) => t.hospitalId === hospitalId && t.fromDepartment === 'ER' && ACTIVE_TRANSFER_STATUS.includes(t.status))\n    .sort((a, b) => ms(a.requestedAt) - ms(b.requestedAt));\n}\n\n// Overdue operational work for a department: open tasks and open tickets past their due time.\nexport function selectOverdueWork(state, hospitalId, now, department = 'ER') {\n  const late = (x) => x.dueAt && ms(x.dueAt) < ms(now) && x.hospitalId === hospitalId && x.department === department;\n  return [\n    ...values(state, 'tasks').filter((t) => isOpenTask(t) && late(t)),\n    ...values(state, 'maintenanceTickets').filter((t) => isOpenTicket(t) && late(t)),\n  ].sort((a, b) => ms(a.dueAt) - ms(b.dueAt));\n}\n\n// One entry per ER dashboard tile: what it lists (cases, beds, transfers or work items) and the ids.\nexport const ER_TILE_KEYS = ['incoming', 'awaitingTriage', 'waiting', 'inCare', 'available', 'reserved', 'beingCleaned',\n  'blockedMaintenance', 'blockedEquipment', 'blockedStaffing', 'icuRequests', 'overdueTasks'];\n\nexport function erDashboard(state, hospitalId, now) {\n  const entry = (kind, list) => ({ kind, count: list.length, ids: list.map((x) => x.id) });\n  return {\n    incoming: entry('cases', selectIncoming(state, hospitalId)),\n    awaitingTriage: entry('cases', selectAwaitingTriage(state, hospitalId)),\n    waiting: entry('cases', selectWaiting(state, hospitalId)),\n    inCare: entry('beds', selectInCare(state, hospitalId)),\n    available: entry('beds', selectAvailableBeds(state, hospitalId, now)),\n    reserved: entry('beds', selectReservedBeds(state, hospitalId, now)),\n    beingCleaned: entry('beds', selectBeingCleaned(state, hospitalId, now)),\n    blockedMaintenance: entry('beds', selectBlockedBeds(state, hospitalId, now, 'maintenance')),\n    blockedEquipment: entry('beds', selectBlockedBeds(state, hospitalId, now, 'equipment')),\n    blockedStaffing: entry('beds', selectBlockedBeds(state, hospitalId, now, 'staffing')),\n    icuRequests: entry('transfers', selectIcuRequests(state, hospitalId)),\n    overdueTasks: entry('work', selectOverdueWork(state, hospitalId, now)),\n  };\n}\n\n// Compact counts (kept from Task 1's readiness.deriveErCounts, which now lives here).\nexport function deriveErCounts(state, hospitalId, now) {\n  const d = erDashboard(state, hospitalId, now);\n  return {\n    incoming: d.incoming.count, awaitingTriage: d.awaitingTriage.count, waiting: d.waiting.count, inCare: d.inCare.count,\n    availableStaffedBeds: d.available.count, reservedBeds: d.reserved.count, beingCleaned: d.beingCleaned.count,\n    blockedBeds: selectBlockedBeds(state, hospitalId, now).length, icuRequests: d.icuRequests.count, overdueTasks: d.overdueTasks.count,\n  };\n}\n\n// Presentation level for a bed card, derived from the shared readiness result:\n// ready (green) · pending (amber: turnover work only) · blocked (red: fault, equipment or staffing) · reserved · occupied.\nexport function bedBoardStatus(bed, state, now) {\n  const readiness = deriveBedReadiness(bed, state, now);\n  const types = readiness.blockers.map((b) => b.type);\n  const occupied = bed.occupancy.status === 'occupied';\n  let level;\n  if (readiness.available) level = 'ready';\n  else if (occupied) level = 'occupied';\n  else if (types.some((t) => HARD_BLOCKERS.includes(t))) level = 'blocked';\n  else if (types.every((t) => t === 'reserved')) level = 'reserved';\n  else level = 'pending';\n  const urgent = occupied && types.some((t) => HARD_BLOCKERS.includes(t));\n  const forecast = !occupied && !readiness.available && level !== 'reserved' ? forecastReadyTime(bed, state, now) : null;\n  const since = [bed.occupancy.since, bed.cleaning.since, bed.nursingVerification.since, ...readiness.blockers.map((b) => b.since)]\n    .filter(Boolean).reduce((a, b) => (ms(b) > ms(a) ? b : a));\n  return { level, urgent, readiness, forecast, since, reservation: activeReservationForBed(state, bed.id, now) };\n}\n\nexport function commentsFor(state, targetType, targetId) {\n  return values(state, 'comments')\n    .filter((c) => (c.targetType === targetType && c.targetId === targetId) || (targetType === 'case' && c.caseId === targetId))\n    .sort((a, b) => ms(a.createdAt) - ms(b.createdAt));\n}\n\n// Audit events that touched or referenced a record, newest first.\nexport function historyFor(state, entity, id) {\n  return values(state, 'auditEvents')\n    .filter((e) => e.refs?.some((r) => r.entity === entity && r.id === id) || e.changed?.includes(id))\n    .sort((a, b) => ms(b.at) - ms(a.at));\n}\n\n// Care tasks for a patient (treatments, diagnostics, reviews, handovers) — separate from bed state.\nconst BED_WORK = ['cleaning', 'nursing_verification', 'staffing', 'equipment_check'];\nexport function careTasksForPatient(state, patientId) {\n  return values(state, 'tasks').filter((t) => t.linked.patientId === patientId && !BED_WORK.includes(t.category))\n    .sort((a, b) => Number(!isOpenTask(a)) - Number(!isOpenTask(b)) || ms(b.createdAt) - ms(a.createdAt));\n}\nexport function bedWorkTasks(state, bedId) {\n  return values(state, 'tasks').filter((t) => t.linked.bedId === bedId && BED_WORK.includes(t.category) && isOpenTask(t));\n}\n\n// \"My tasks\": open tasks for the user's role (unclaimed or mine) plus, for technicians, their ticket queue.\nconst TECH_KIND = { main function addMinutes(iso, minutes) {
  return new Date(Date.parse(iso) + minutes * 60000).toISOString();
}

function isOpenTask(task) {
  return !CLOSED_TASK_STATUS.includes(task.status);
}

function isOpenTicket(ticket) {
  return ticket.status !== 'resolved';
}

function emptyState() {
  const s = { meta: {} };
  for (const c of COLLECTIONS) s[c] = {};
  return s;
}

// Stable sequential IDs; the store always dispatches against the freshest persisted state, so counters stay unique.
function nextId(state, prefix) {
  const counters = state.meta.counters;
  counters[prefix] = (counters[prefix] ?? 100) + 1;
  return `${prefix}-${counters[prefix]}`;
}

// Human-facing references (case SL-2041, ticket MT-511 / BM-721, transfer TR-301).
function nextRef(state, prefix) {
  const refs = state.meta.refCounters;
  refs[prefix] = (refs[prefix] ?? 1000) + 1;
  return `${prefix}-${refs[prefix]}`;
}

function values(state, collection) {
  return Object.values(state[collection] ?? {});
}
